name: WaveOS quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    # Playwright 1.56 does not provide Chromium for Ubuntu 26.04. Pin the
    # supported runner instead of letting ubuntu-latest break browser QA.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config tests/navigation/playwright.config.ts
