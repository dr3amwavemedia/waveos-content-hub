name: WaveOS quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/unit/local-workflows.test.mjs
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config tests/navigation/playwright.config.ts
