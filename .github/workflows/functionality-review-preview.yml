name: WaveOS functionality review preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload-review-version:
    if: github.head_ref == 'codex/waveos-functionality-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes wrangler@latest versions upload --keep-vars --preview-alias functionality-review
