name: WaveOS functionality review preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload-review-version:
    if: github.head_ref == 'codex/waveos-functionality-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build review bundle
        run: npm run build

      - name: Upload review-only Worker version
        run: npx --yes wrangler@latest versions upload --keep-vars --preview-alias functionality-review
